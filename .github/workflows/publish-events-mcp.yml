name: Publish events-mcp

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm install --global npm@11.20.0
      - run: bun install --frozen-lockfile
      - name: Check the tag matches the package version
        run: |
          version="$(node -p "require('./packages/events-mcp/package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match v$version"
            exit 1
          fi
      - run: bun run check
      - run: bun run test:install
      - name: Stage the package on npm
        working-directory: packages/events-mcp
        run: npm stage publish
